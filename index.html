<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ateliê de Coloração de Mapas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1826;
    --panel:#172239;
    --panel-2:#1E2C48;
    --parchment:#EDE4CC;
    --muted:#93A0B8;
    --line:#2E3B58;
    --brass:#C9A227;
    --c1:#C9A227; /* ocre/latao */
    --c2:#7A8C6E; /* sálvia */
    --c3:#B5583F; /* terracota-tijolo */
    --c4:#4C6B8A; /* azul aço */
    --c5:#8C6A9C; /* ameixa */
    --c6:#D8C9A3; /* pergaminho */
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(ellipse at 20% -10%, #1A2743 0%, var(--ink) 55%);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:36px 20px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  header{text-align:center;margin-bottom:28px;position:relative;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--brass);margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,4.4vw,38px);
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  header p{color:var(--muted);font-size:14.5px;max-width:480px;margin:0 auto;line-height:1.5;}

  .compass{position:absolute;top:-6px;right:0;opacity:.35;}
  @media(max-width:560px){.compass{display:none;}}

  nav.tabs{
    display:flex;flex-direction:column;gap:16px;
    margin-bottom:22px;
  }
  nav.tabs button{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;letter-spacing:.03em;
    background:var(--panel);
    color:var(--muted);
    border:1px solid var(--line);
    padding:9px 14px;border-radius:3px;
    cursor:pointer;
    transition:all .15s ease;
  }
  nav.tabs button:hover{color:var(--parchment);border-color:var(--brass);}
  nav.tabs button.active{
    background:var(--brass);color:var(--ink);border-color:var(--brass);font-weight:700;
  }
  nav.tabs button .n{opacity:.6;font-size:10px;display:block;margin-top:2px;}
  nav.tabs button.active .n{opacity:.65;}

  .stage{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:22px;
  }

  .toolbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:16px;flex-wrap:wrap;gap:12px;
  }
  .palette{display:flex;gap:8px;}
  .swatch{
    width:30px;height:30px;border-radius:50%;
    border:2px solid rgba(237,228,204,.15);
    cursor:pointer;position:relative;
    transition:transform .12s ease;
  }
  .swatch:hover{transform:translateY(-2px);}
  .swatch.selected{border-color:var(--parchment);box-shadow:0 0 0 3px var(--panel), 0 0 0 4px var(--brass);}

  .readout{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;color:var(--ink);
    background:var(--parchment);
    padding:6px 12px;border-radius:20px;
    font-weight:700;letter-spacing:.02em;
  }
  .readout span{color:var(--c3);}
  .readout-regions span{color:var(--c4);}

  .clear-btn{
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    background:transparent;color:var(--muted);
    border:1px solid var(--line);padding:7px 13px;border-radius:20px;
    cursor:pointer;
  }
  .clear-btn:hover{color:var(--parchment);border-color:var(--muted);}

  .canvas-holder{
    display:flex;justify-content:center;align-items:center;
    background:#0C1420;border-radius:4px;padding:18px;
  }
  svg{max-width:100%;height:auto;display:block;}
  .region{
    fill:#242F49; stroke:#0C1420; stroke-width:1.4;
    cursor:pointer; transition:fill .1s ease;
  }
  .region:hover{stroke:var(--brass); stroke-width:1.8;}

  .note{
    margin-top:16px;font-size:12.5px;color:var(--muted);line-height:1.55;
    border-top:1px dashed var(--line);padding-top:14px;
  }
  .note b{color:var(--parchment);}

  footer{text-align:center;margin-top:20px;font-size:11.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;}

  .banner{margin-top:14px;padding:12px 16px;border-radius:6px;font-size:13.5px;line-height:1.5;display:flex;gap:10px;align-items:flex-start;}
  .banner.hidden{display:none;}
  .banner .icon{font-size:16px;line-height:1;}
  .banner.error{background:rgba(214,69,69,.14);border:1px solid #D64545;color:#F5C2C2;}
  .banner.tip{background:rgba(201,162,39,.14);border:1px solid var(--brass);color:#EAD9A0;}
  .banner.success{background:rgba(76,175,109,.14);border:1px solid #4CAF6D;color:#BFEACB;}

  .hidden{display:none !important;}

  .back-btn{
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    background:transparent;color:var(--muted);
    border:1px solid var(--line);padding:7px 14px;border-radius:20px;
    cursor:pointer;margin-bottom:16px;
  }
  .back-btn:hover{color:var(--parchment);border-color:var(--muted);}
  .back-row{margin-bottom:24px;}
  .tab-group-centered{text-align:center;}
  .tab-group-centered .tab-row{justify-content:center;}
  .tab-group{margin-bottom:10px;}
  .tab-group-label{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin-bottom:6px;
  }
  .tab-row{display:flex;flex-wrap:wrap;gap:6px;}

  .switch-prompt{
    margin-top:18px;padding:12px 16px;
    border:1px dashed var(--line);border-radius:6px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    flex-wrap:wrap;
  }
  .switch-prompt-text{font-size:12.5px;color:var(--muted);line-height:1.5;}
  .switch-prompt button{
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;
    background:transparent;color:var(--brass);
    border:1px solid var(--brass);padding:8px 14px;border-radius:20px;
    cursor:pointer;white-space:nowrap;
  }
  .switch-prompt button:hover{background:var(--brass);color:var(--ink);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(6,10,18,.7);
    display:flex;align-items:center;justify-content:center;z-index:50;
    padding:20px;
  }
  .modal-overlay.hidden{display:none;}
  .modal-card{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:26px 28px;max-width:420px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal-overlay.error .modal-card{border-color:#D64545;}
  .modal-overlay.tip .modal-card{border-color:var(--brass);}
  .modal-overlay.success .modal-card{border-color:#4CAF6D;}
  .modal-icon{font-size:34px;margin-bottom:12px;}
  .modal-text{font-size:14.5px;line-height:1.6;color:var(--parchment);margin-bottom:18px;}
  .modal-close{
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
    background:var(--brass);color:var(--ink);border:none;padding:9px 20px;
    border-radius:20px;cursor:pointer;
  }
  .modal-close:hover{opacity:.9;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Produto educacional · PROFMAT</div>
    <h1>Ateliê de Coloração de Mapas</h1>
    <p>Escolha uma cor e pinte as regiões — nenhuma delas pode ter a mesma cor de uma vizinha. Qual o menor número de cores que você consegue usar?</p>

          <button class="clear-btn" id="clearBtn">Limpar</button>
        </div>
      </div>
      <div class="canvas-holder">
        <svg id="svg" viewBox="0 0 600 600"></svg>
      </div>
      <div class="banner hidden" id="banner"></div>
      <div class="note" id="note"></div>
    </div>

    <div id="switchPromptContainer"></div>
  </section>

  <footer>ateliê de coloração · v1.0 · Witássio Oliveira (IM - UFAL)</footer>
</div>

  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal-card">
      <div class="modal-icon" id="modalIcon"></div>
      <div class="modal-text" id="modalText"></div>
      <button class="modal-close" id="modalClose">Fechar</button>
    </div>
  </div>

  DEBW:'Baden-Württemberg', DEBY:'Bayern', DEBE:'Berlim', DEBB:'Brandemburgo',
  DEHB:'Bremen', DEHH:'Hamburgo', DEHE:'Hessen', DEMV:'Mecklemburgo-Pomerânia Ocidental',

// ---------- Geometry generators ----------
function rectPts(x0,y0,x1,y1){ return [[x0,y0],[x1,y0],[x1,y1],[x0,y1]]; }
function polyPath(pts){ return 'M ' + pts.map(p=>p[0]+' '+p[1]).join(' L ') + ' Z'; }
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

// Trapezoid brick for one side of a square annulus ring (no-gap picture-frame tiling)
function sideTrapezoid(axis, cIn, cOut, f0, f1){
  if(axis==='top' || axis==='bottom'){
    const sign = axis==='top' ? -1 : 1;
    const xIn0=-cIn+f0*2*cIn, xIn1=-cIn+f1*2*cIn;
    const xOut0=-cOut+f0*2*cOut, xOut1=-cOut+f1*2*cOut;
    return [[xIn0,sign*cIn],[xIn1,sign*cIn],[xOut1,sign*cOut],[xOut0,sign*cOut]];
  } else {
    const sign = axis==='left' ? -1 : 1;
    const yIn0=-cIn+f0*2*cIn, yIn1=-cIn+f1*2*cIn;
    const yOut0=-cOut+f0*2*cOut, yOut1=-cOut+f1*2*cOut;
    return [[sign*cIn,yIn0],[sign*cIn,yIn1],[sign*cOut,yOut1],[sign*cOut,yOut0]];
  }
}

function buildSpiralMap(rings, bricksPerSide, jitterSeed){
  const regions = [];
  const c0 = 36;
  const t = (300 - c0) / rings;
  let rand = mulberry32(jitterSeed);

  regions.push({ pts: rectPts(-c0,-c0,c0,c0) });

  for(let r=0; r<rings; r++){
    const cIn = c0 + r*t;
    const cOut = c0 + (r+1)*t;
    const offset = (r % 2 === 1) ? 1 : 0;
    const m = bricksPerSide + (Math.floor(rand()*2)===1 && r>1 ? 1 : 0);

    ['top','right','bottom','left'].forEach((axis)=>{
      const n = m;
      const shiftFrac = offset ? (0.5/n) : 0;
      for(let i=0;i<n;i++){
        let f0 = i/n + shiftFrac;
        let f1 = (i+1)/n + shiftFrac;
        f0 = Math.max(0, Math.min(1,f0));
        f1 = Math.max(0, Math.min(1,f1));
        if(f1<=f0) return;
        regions.push({pts: sideTrapezoid(axis, cIn, cOut, f0, f1)});
      }
    });
  }
  return {regions, viewbox:[-310,-310,620,620]};
}

function buildLabyrinthMap(seed, targetCount){
  let rand = mulberry32(seed);
  let cells = [{x:-280,y:-280,w:560,h:560}];
  while(cells.length < targetCount){
    cells.sort((a,b)=> (b.w*b.h)-(a.w*a.h));
    const c = cells.shift();
    const splitVert = c.w > c.h;
    if(splitVert){
      const cut = c.w*(0.32+rand()*0.36);
      cells.push({x:c.x,y:c.y,w:cut,h:c.h});
      cells.push({x:c.x+cut,y:c.y,w:c.w-cut,h:c.h});
    } else {
      const cut = c.h*(0.32+rand()*0.36);
      cells.push({x:c.x,y:c.y,w:c.w,h:cut});
      cells.push({x:c.x,y:c.y+cut,w:c.w,h:c.h-cut});
    }
  }
  const regions = cells.map(c=>({pts: rectPts(c.x,c.y,c.x+c.w,c.y+c.h)}));
  return {regions, viewbox:[-300,-300,600,600]};
}

// ---------- Adjacency ----------
function idPairsToIndex(adjMap, regions){
  const idToIdx = {};
  regions.forEach((r,i)=>{ idToIdx[r.id]=i; });
  const seen = new Set(); const pairs = [];
  Object.entries(adjMap).forEach(([id,neighbors])=>{
    const i = idToIdx[id];
    if(i===undefined) return;
    neighbors.forEach(nid=>{
      const j = idToIdx[nid];
      if(j===undefined) return;
      const k = i<j? i+'_'+j : j+'_'+i;
      if(!seen.has(k)){ seen.add(k); pairs.push([Math.min(i,j),Math.max(i,j)]); }
    });
  });
  return pairs;
}

// Geometric adjacency for procedural axis-aligned polygons (handles h/v edges via
// interval overlap, and diagonal edges via exact endpoint match)
function computeGeomAdjacency(regions){
  const rk = v=>Math.round(v*1000)/1000;
  const edges=[];
  regions.forEach((r,idx)=>{
    const pts=r.pts;
    for(let k=0;k<pts.length;k++){
      const [x1,y1]=pts[k], [x2,y2]=pts[(k+1)%pts.length];
      if(Math.abs(y1-y2)<1e-6){
        edges.push({idx,type:'h',y:rk(y1),a:rk(Math.min(x1,x2)),b:rk(Math.max(x1,x2))});
      } else if(Math.abs(x1-x2)<1e-6){
        edges.push({idx,type:'v',x:rk(x1),a:rk(Math.min(y1,y2)),b:rk(Math.max(y1,y2))});
      } else {
        edges.push({idx,type:'d',p1:[rk(x1),rk(y1)],p2:[rk(x2),rk(y2)]});
      }
    }
  });
  const seen=new Set(); const pairs=[];
  function addPair(i,j){ if(i===j) return; const k=i<j?i+'_'+j:j+'_'+i; if(!seen.has(k)){seen.add(k); pairs.push([Math.min(i,j),Math.max(i,j)]);} }
  function ptEq(a,b){ return Math.abs(a[0]-b[0])<0.01 && Math.abs(a[1]-b[1])<0.01; }
  for(let i=0;i<edges.length;i++){
    for(let j=i+1;j<edges.length;j++){
      const A=edges[i], B=edges[j];
      if(A.idx===B.idx || A.type!==B.type) continue;
      if(A.type==='h' && Math.abs(A.y-B.y)<0.02){
        const ov = Math.min(A.b,B.b)-Math.max(A.a,B.a);
        if(ov>0.02) addPair(A.idx,B.idx);
      } else if(A.type==='v' && Math.abs(A.x-B.x)<0.02){
        const ov = Math.min(A.b,B.b)-Math.max(A.a,B.a);
        if(ov>0.02) addPair(A.idx,B.idx);
      } else if(A.type==='d'){
        if((ptEq(A.p1,B.p1)&&ptEq(A.p2,B.p2)) || (ptEq(A.p1,B.p2)&&ptEq(A.p2,B.p1))){
          addPair(A.idx,B.idx);
        }
      }
    }
  }
  return pairs;
}

// Geometric adjacency for real (complex, hand-digitized) polygons via vertex proximity.
// Used for the UK map, whose regions don't have a clean id-based neighbor list available.
function parsePathVertices(d){
  const verts=[];
  const re=/[ML](-?[\d.]+),(-?[\d.]+)/g;
  let m;
  while((m=re.exec(d))){ verts.push([parseFloat(m[1]),parseFloat(m[2])]); }
  return verts;
}
function computePathAdjacency(regions, bucketSize, minHits){
  const vertsList = regions.map(r=>parsePathVertices(r.d));
  const grid = new Map();
  vertsList.forEach((verts,idx)=>{
    verts.forEach(([x,y])=>{
      const k = Math.round(x/bucketSize)+'_'+Math.round(y/bucketSize);
      if(!grid.has(k)) grid.set(k, new Set());
      grid.get(k).add(idx);
    });
  });
  const pairCounts = new Map();
  vertsList.forEach((verts,idx)=>{
    verts.forEach(([x,y])=>{
      const bx=Math.round(x/bucketSize), by=Math.round(y/bucketSize);
      const matched = new Set();
      for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){
        const s = grid.get((bx+dx)+'_'+(by+dy));
        if(s) s.forEach(o=>matched.add(o));
      }
      matched.delete(idx);
      matched.forEach(o=>{
        const key = idx<o? idx+'_'+o : o+'_'+idx;
        pairCounts.set(key, (pairCounts.get(key)||0)+1);
      });
    });
  });
  const pairs=[];
  pairCounts.forEach((v,key)=>{
    if(v>=minHits){
      const [i,j]=key.split('_').map(Number);
      pairs.push([i,j]);
    }
  });
  return pairs;
}

function computeAdjacency(key, regions){
  if(key==='brasil') return idPairsToIndex(BR_ADJ, regions);
  if(key==='eua') return idPairsToIndex(US_ADJ, regions);
  if(key==='alemanha') return idPairsToIndex(DE_ADJ, regions);
  if(key==='reino_unido') return computePathAdjacency(regions, 3, 8);
  if(key==='toro' || key==='klein'){
    const internal = computeGeomAdjacency(regions);
    const wrap = computeWrapAdjacency(regions, {xMin:-280,xMax:280,yMin:-280,yMax:280}, key==='klein'?'klein':'torus');
    const seen = new Set(internal.map(p=>p[0]+'_'+p[1]));
    wrap.forEach(p=>{
      const k = p[0]+'_'+p[1];
      if(!seen.has(k)){ seen.add(k); internal.push(p); }
    });
    return internal;
  }
  return computeGeomAdjacency(regions);
}

// Border-identification adjacency for closed surfaces built from a rectangular
// fundamental polygon (labyrinth-style cells). 'torus': left~right and top~bottom
// glued with matching orientation. 'klein': left~right glued normally, but
// top~bottom glued with a flip (mirrored), which is what gives the Klein bottle
// its twist.
function computeWrapAdjacency(regions, bounds, mode){
  const {xMin,xMax,yMin,yMax} = bounds;
  const eps = 0.5;
  const leftCells=[], rightCells=[], topCells=[], bottomCells=[];
  regions.forEach((r,idx)=>{
    const xs = r.pts.map(p=>p[0]), ys = r.pts.map(p=>p[1]);
    const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
    if(Math.abs(x0-xMin)<eps) leftCells.push({idx, a:y0, b:y1});
    if(Math.abs(x1-xMax)<eps) rightCells.push({idx, a:y0, b:y1});
    if(Math.abs(y0-yMin)<eps) topCells.push({idx, a:x0, b:x1});
    if(Math.abs(y1-yMax)<eps) bottomCells.push({idx, a:x0, b:x1});
  });
  function overlap(a0,a1,b0,b1){ return Math.min(a1,b1) - Math.max(a0,b0) > eps; }
  const pairs = [];
  leftCells.forEach(L=>{
    rightCells.forEach(R=>{
      if(L.idx!==R.idx && overlap(L.a,L.b,R.a,R.b)) pairs.push([Math.min(L.idx,R.idx),Math.max(L.idx,R.idx)]);
    });
  });
  topCells.forEach(T=>{
    bottomCells.forEach(B=>{
      if(T.idx===B.idx) return;
      const match = mode==='klein' ? overlap(T.a,T.b,-B.b,-B.a) : overlap(T.a,T.b,B.a,B.b);
      if(match) pairs.push([Math.min(T.idx,B.idx),Math.max(T.idx,B.idx)]);
    });
  });
  return pairs;
}

function groupsForCategory(cat){
  if(cat==='superficies') return [['superficies', 'Superfícies fechadas']];

}

// ---------- App state ----------
let category = 'principal';
let current = 'alemanha';
let selectedColor = 0;
let regionColors = {};
let mapCache = {};
let wasComplete = false;

const svgEl = document.getElementById('svg');
const tabsEl = document.getElementById('tabs');
const switchPromptContainerEl = document.getElementById('switchPromptContainer');
const paletteEl = document.getElementById('palette');
const readoutEl = document.getElementById('readout');
const readoutRegionsEl = document.getElementById('readoutRegions');
const noteEl = document.getElementById('note');
const bannerEl = document.getElementById('banner');
const modalOverlay = document.getElementById('modalOverlay');
const modalIcon = document.getElementById('modalIcon');
const modalText = document.getElementById('modalText');
const modalClose = document.getElementById('modalClose');

function getMapData(key){
  if(!mapCache[key]){
    const raw = MAPS[key].build();
    const adjacency = computeAdjacency(key, raw.regions);
    mapCache[key] = {regions: raw.regions, viewbox: raw.viewbox, transform: raw.transform, adjacency};
  }
  return mapCache[key];
}

function switchMap(key){
  current = key;
  regionColors = {};
  wasComplete = false;
  hideBanner();
  hideModal();
  render();
}

function switchCategory(cat){
  category = cat;
  const groups = groupsForCategory(cat);
  const firstEntry = Object.entries(MAPS).find(([k,m])=> groups.some(([g])=>g===m.group));
  switchMap(firstEntry[0]);
}

function renderTabs(){
  tabsEl.innerHTML = '';

  if(category==='superficies'){
    const backRow = document.createElement('div');
    backRow.className = 'back-row';
    const backBtn = document.createElement('button');
    backBtn.className = 'back-btn';
    backBtn.textContent = '← Voltar aos mapas';
    backBtn.onclick = ()=>switchCategory('principal');
    backRow.appendChild(backBtn);
    tabsEl.appendChild(backRow);
  }

  groupsForCategory(category).forEach(([gKey, gLabel])=>{
    const wrap = document.createElement('div');
    wrap.className = 'tab-group tab-group-centered';
    const h = document.createElement('div');
    h.className = 'tab-group-label';
    h.textContent = gLabel;
    wrap.appendChild(h);
    const row = document.createElement('div');
    row.className = 'tab-row';
    Object.entries(MAPS).filter(([k,m])=>m.group===gKey).forEach(([key,m])=>{
      const btn = document.createElement('button');
      btn.className = key===current ? 'active':'';
      btn.innerHTML = `${m.label}<span class="n">${m.n}</span>`;
      btn.onclick = ()=>switchMap(key);
      row.appendChild(btn);
    });
    wrap.appendChild(row);
    tabsEl.appendChild(wrap);
  });
}

function renderSwitchPrompt(){
  switchPromptContainerEl.innerHTML = '';
  if(category!=='principal') return;
  const prompt = document.createElement('div');
  prompt.className = 'switch-prompt';
  prompt.innerHTML = `<div class="switch-prompt-text">Já explorou os mapas-desafio? Existe uma categoria de mapas ainda mais exigente, em superfícies fechadas — onde 4 cores podem não bastar.</div>`;
  const goBtn = document.createElement('button');
  goBtn.textContent = 'Superfícies fechadas →';
  goBtn.onclick = ()=>switchCategory('superficies');
  prompt.appendChild(goBtn);
  switchPromptContainerEl.appendChild(prompt);
}

function renderPalette(){
  paletteEl.innerHTML = '';
  COLORS.forEach((col,i)=>{
    const s = document.createElement('div');
    s.className = 'swatch' + (i===selectedColor?' selected':'');
    s.style.background = col;
    s.onclick = ()=>{ selectedColor = i; renderPalette(); };
    paletteEl.appendChild(s);
  });
}

function renderMap(){
  const map = getMapData(current);
  const [x,y,w,h] = map.viewbox;
  svgEl.setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
  svgEl.innerHTML = '';
  const container = document.createElementNS('http://www.w3.org/2000/svg','g');
  if(map.transform){ container.setAttribute('transform', `matrix(${map.transform})`); }
  map.regions.forEach((reg,idx)=>{
    const dStr = reg.d || polyPath(reg.pts);
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', dStr);
    path.setAttribute('class','region');
    if(reg.title){
      const ti = document.createElementNS('http://www.w3.org/2000/svg','title');
      ti.textContent = reg.title;
      path.appendChild(ti);
    }
    const colIdx = regionColors[idx];
    path.style.fill = colIdx===undefined ? '#242F49' : COLORS[colIdx];
    path.onclick = ()=>{
      if(regionColors[idx] === selectedColor){
        delete regionColors[idx];
      } else {
        regionColors[idx] = selectedColor;
      }
      renderMap();
      updateReadout();
      checkCompletion();
    };
    container.appendChild(path);
  });

  if(current==='toro' || current==='klein'){
    const isKlein = current==='klein';
    const mkLine = (x1,y1,x2,y2,color,dash)=>{
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',x1); line.setAttribute('y1',y1);
      line.setAttribute('x2',x2); line.setAttribute('y2',y2);
      line.setAttribute('stroke', color);
      line.setAttribute('stroke-width', 4);
      line.setAttribute('stroke-dasharray', dash);
      line.setAttribute('stroke-linecap','round');
      container.appendChild(line);
    };
    // left/right edges: always identified with matching orientation (both maps)
    mkLine(-280,-280,-280,280,'#C9A227','14 8');
    mkLine(280,-280,280,280,'#C9A227','14 8');
    // top/bottom edges: matching orientation on the torus, flipped (dotted) on the Klein bottle
    const tbDash = isKlein ? '2 7' : '14 8';
    mkLine(-280,-280,280,-280,'#3D8BFF',tbDash);
    mkLine(-280,280,280,280,'#3D8BFF',tbDash);
  }

  svgEl.appendChild(container);
}

function updateReadout(){
  const used = new Set(Object.values(regionColors));
  readoutEl.innerHTML = `<span>${used.size}</span> ${used.size===1?'cor usada':'cores usadas'}`;

  const total = getMapData(current).regions.length;
  const painted = Object.keys(regionColors).length;
  readoutRegionsEl.innerHTML = `<span>${painted}/${total}</span> ${total===1?'região pintada':'regiões pintadas'}`;
}

function showBanner(kind, text){
  bannerEl.className = 'banner ' + kind;
  const icon = kind==='error' ? '⚠' : (kind==='tip' ? '💡' : '🎉');
  bannerEl.innerHTML = `<span class="icon">${icon}</span><span>${text}</span>`;
}
function hideBanner(){
  bannerEl.className = 'banner hidden';
  bannerEl.innerHTML = '';
}
function showModal(kind, text){
  modalOverlay.className = 'modal-overlay ' + kind;
  modalIcon.textContent = kind==='error' ? '⚠' : (kind==='tip' ? '💡' : '🎉');
  modalText.textContent = text;
}
function hideModal(){
  modalOverlay.className = 'modal-overlay hidden';
}
modalClose.onclick = hideModal;
modalOverlay.onclick = (e)=>{ if(e.target===modalOverlay) hideModal(); };

function checkCompletion(){
  const map = getMapData(current);
  const total = map.regions.length;
  const painted = Object.keys(regionColors).length;
  const complete = painted >= total;
  if(!complete){ wasComplete = false; hideBanner(); return; }

  let conflict = false;
  for(const [i,j] of map.adjacency){
    if(regionColors[i] !== undefined && regionColors[i] === regionColors[j]){ conflict = true; break; }
  }
  const usedColors = new Set(Object.values(regionColors)).size;
  const maxColors = MAPS[current].maxColors || 4;

  let kind, text;
  if(conflict){
    kind = 'error';
    text = 'Há um erro: existem regiões vizinhas com a mesma cor. Reveja o mapa e tente novamente.';
  } else if(usedColors > maxColors){
    kind = 'tip';
    text = `Mapa pintado corretamente, usando ${usedColors} cores! Será que dá pra colorir esse mesmo mapa usando ${maxColors} cores ou menos?`;
  } else {
    kind = 'success';
    text = `Parabéns! Você coloriu o mapa inteiro usando apenas ${usedColors} ${usedColors===1?'cor':'cores'}, sem nenhum conflito entre vizinhos. Bora tentar outro mapa no ateliê?`;
  }

  showBanner(kind, text);
  if(!wasComplete){ showModal(kind, text); }
  wasComplete = true;
}

function render(){
  renderTabs();
  renderPalette();
  renderMap();
  updateReadout();
  noteEl.innerHTML = `<b>Sobre este mapa:</b> ${MAPS[current].note}`;
  renderSwitchPrompt();
}

document.getElementById('clearBtn').onclick = ()=>{ regionColors = {}; wasComplete = false; hideBanner(); hideModal(); renderMap(); updateReadout(); };

render();
</script>

</body>
</html>
